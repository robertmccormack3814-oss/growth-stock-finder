name: Growth Stock Finder - NASDAQ

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nasdaq stocks to analyse this run"
        required: false
        default: "120"
  schedule:
    - cron: "15 22 * * 1-5"
    - cron: "15 1,4,7 * * 2-6"
    - cron: "20 20 * * 0"

permissions:
  contents: write

concurrency:
  group: growth-stock-finder
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build or refresh Nasdaq universe
        shell: bash
        run: |
          if [ ! -f data/universe.json ] || grep -q '"ticker": ".*\.AX"' data/universe.json || [ "$(date -u +%u)" = "7" ]; then
            python scripts/build_universe.py
          fi

      - name: Run Nasdaq quality-growth scan
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '120' }}
        run: python scripts/scan.py

      - name: Update simulated NASDAQ performance ledger
        run: python scripts/update_ledger.py

      - name: Commit scanner state and ledger
        shell: bash
        run: |
          git config user.name "Growth Stock Finder Bot"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh NASDAQ growth signals and ledger"
          git pull --rebase
          git push
